[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-strat"
version = "0.1.0"
description = "Пайплайн рыночных данных (скачивание, нормализация, проверки качества), event-driven бэктест и инструменты исследований"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
# сервер задач и веб-интерфейсы
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.35", "fastapi>=0.110", "uvicorn>=0.29"]
# исследования: графики, ноутбуки, точные p-значения
research = ["matplotlib>=3.8", "scipy>=1.11", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "build>=1.0"]
all = ["backtest-strat[api,ui,research]"]

[project.scripts]
bt-data = "backtest_strat.cli:main"                    # скачать / нормализовать / проверить / построить датасеты
bt-schedule = "backtest_strat.scheduler:main"          # ночной планировщик (cron)
bt-backtest = "backtest_strat.backtest.cli:main"       # прогон стратегии на событиях
bt-api = "backtest_strat.ui.launch:api"                # HTTP API задач
bt-dashboard = "backtest_strat.ui.launch:dashboard"    # веб-дашборд
bt-monitor = "backtest_strat.ui.launch:monitor"        # монитор процесса

[tool.setuptools.packages.find]
include = ["backtest_strat*"]
exclude = ["tests*", "research*", "scripts*", "docs*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
